<!doctype html>
<meta charset="utf-8">
<title>ICE pending</title>
<script>
  // Gathers this machine's ICE candidates and reports whether any shows a
  // raw local IP address (08 §8).
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.createDataChannel("probe");
  const seen = [];
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      seen.push(e.candidate.candidate);
      return;
    }
    const raw = seen.some((c) => /\s(\d{1,3}(\.\d{1,3}){3}|[0-9a-f]*:[0-9a-f:]+)\s\d+\styp host/i.test(c));
    document.title = "ICE: " + (raw ? "ip" : "hidden");
  };
  pc.createOffer().then((o) => pc.setLocalDescription(o));
  setTimeout(() => {
    if (document.title === "ICE pending") document.title = "ICE: hidden";
  }, 4000);
</script>
