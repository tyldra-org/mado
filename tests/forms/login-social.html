<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Log in</title></head>
<body>
<form data-expect-kind="login">
  <input type="text" class="inputtext" name="email" id="email" placeholder="Email address or phone number" aria-label="Email address or phone number" data-expect="username" />
  <input type="password" class="inputtext" name="pass" id="pass" placeholder="Password" aria-label="Password" data-expect="password" />
  <button name="login" type="submit">Log in</button>
  <a href="/r">Create new account</a>
</form>
</body>
</html>
