<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Sign in to the forge</title></head>
<body>
<!-- Modelled on a code host's sign-in. -->
<form action="/session" method="post" data-expect-kind="login">
  <input type="hidden" name="authenticity_token" value="x" />
  <label for="login_field">Username or email address</label>
  <input type="text" name="login" id="login_field" autocapitalize="off" data-expect="username" />
  <label for="password">Password</label>
  <input type="password" name="password" id="password" data-expect="password" />
  <input type="submit" name="commit" value="Sign in" />
  <p>New here? <a href="/signup">Create an account</a></p>
</form>
</body>
</html>
