<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Change password</title></head>
<body>
<form action="/settings/password" data-expect-kind="changePassword">
  <label for="old">Current password</label><input id="old" name="old_password" type="password" data-expect="password" />
  <label for="new">New password</label><input id="new" name="new_password" type="password" data-expect="newPassword" />
  <label for="again">Confirm new password</label><input id="again" name="new_password_again" type="password" data-expect="newPassword" />
  <button type="submit">Update password</button>
</form>
</body>
</html>
