<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Payment</title></head>
<body>
<form id="payment-form" data-expect-kind="card">
  <label for="cc-name">Name on card</label><input id="cc-name" name="ccname" data-expect="ccName" />
  <label for="cc-number">Card number</label><input id="cc-number" name="cardnumber" inputmode="numeric" data-expect="ccNumber" />
  <label for="cc-exp">Expiration (MM/YY)</label><input id="cc-exp" name="exp-date" placeholder="MM / YY" data-expect="ccExp" />
  <label for="cc-csc">Security code</label><input id="cc-csc" name="cvc" inputmode="numeric" data-expect="ccCsc" />
  <label for="zip">ZIP</label><input id="zip" name="postal" data-expect="postalCode" />
  <button type="submit">Pay</button>
</form>
</body>
</html>
