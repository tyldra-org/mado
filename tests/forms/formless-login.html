<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!-- A single-page app: fields outside any form. -->
    <div id="app">
      <div data-expect-kind="login"></div>
      <input type="text" aria-label="Username" data-expect="username" />
      <input type="password" aria-label="Password" data-expect="password" />
      <button type="button">Sign in</button>
    </div>
  </body>
</html>
