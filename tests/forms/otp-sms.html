<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Enter code</title></head>
<body>
<form data-expect-kind="otp">
  <label for="c">We texted you a code</label>
  <input id="c" name="code" inputmode="numeric" pattern="\d*" maxlength="6" data-expect="otp" />
  <button type="submit">Continue</button>
</form>
</body>
</html>
