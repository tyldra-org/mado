<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Sign in (step 2)</title></head>
<body>
<form action="/signin/challenge/pwd" data-expect-kind="login">
  <h1>Welcome</h1>
  <input type="email" name="identifier" value="me@example.com" readonly hidden />
  <input type="password" name="Passwd" aria-label="Enter your password" autocomplete="current-password" data-expect="password" />
  <label><input type="checkbox" /> Show password</label>
  <button type="submit">Next</button>
</form>
</body>
</html>
