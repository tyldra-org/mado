# The throwaway M0 prototype. It is its own workspace so the main workspace,
# its lints and its checks never build it. Nothing outside proto/ imports it.
[workspace]

[package]
name = "mado-proto"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adblock = { version = "0.13", features = ["content-blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
