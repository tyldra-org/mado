# cargo-about: licences allowed in bundled Rust dependencies. `cargo about
# generate` fails on any other licence (mado-docs/spec/15-release-and-build.md
# section 8). Keep in step with [licenses] allow in deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
targets = ["aarch64-apple-darwin"]
ignore-dev-dependencies = true
