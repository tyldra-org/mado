[package]
name = "mado-extensions"
description = "Chrome Web Store client, CRX3 verification, manifests and overlaps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Test packages for other crates' tests (src/fixtures.rs).
fixtures = []

[lints]
workspace = true

[dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
prost = "0.14.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
roxmltree = "0.21.2"
rsa = { version = "0.10", features = ["pkcs1v15"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util"] }
