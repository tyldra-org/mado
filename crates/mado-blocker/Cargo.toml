[package]
name = "mado-blocker"
description = "The built-in content blocker: filter lists, compilation and statistics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
adblock = { version = "0.13.5", features = ["content-blocking", "css-validation"] }
flate2 = "1.1.11"
mado-lists = { version = "0.0.0", path = "../mado-lists" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.23"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util"] }
