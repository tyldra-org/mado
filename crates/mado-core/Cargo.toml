[package]
name = "mado-core"
description = "The core actor: browser state, command dispatch, patches and service wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Hooks only tests use: a handler that panics (and, from M1-T11, the rest).
test-hooks = []

[lints]
workspace = true

[dependencies]
ammonia = "4.2.5"
base64 = "0.23"
jiff = "0.2.44"
mado-blocker = { version = "0.0.0", path = "../mado-blocker" }
mado-engine = { version = "0.0.0", path = "../mado-engine" }
mado-extensions = { version = "0.0.0", path = "../mado-extensions" }
mado-import = { version = "0.0.0", path = "../mado-import" }
mado-lists = { version = "0.0.0", path = "../mado-lists" }
mado-navigation = { version = "0.0.0", path = "../mado-navigation" }
mado-permissions = { version = "0.0.0", path = "../mado-permissions" }
mado-platform = { version = "0.0.0", path = "../mado-platform" }
mado-safety = { version = "0.0.0", path = "../mado-safety" }
mado-settings = { version = "0.0.0", path = "../mado-settings" }
mado-storage = { version = "0.0.0", path = "../mado-storage" }
mado-types = { version = "0.0.0", path = "../mado-types" }
mado-vault = { version = "0.0.0", path = "../mado-vault" }
psl = "2.1.254"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
json-patch = "5.0.0"
mado-engine-fake = { version = "0.0.0", path = "../mado-engine-fake" }
mado-import = { version = "0.0.0", path = "../mado-import", features = ["fixtures"] }
mado-extensions = { version = "0.0.0", path = "../mado-extensions", features = ["fixtures"] }
mado-vault = { version = "0.0.0", path = "../mado-vault", features = ["testing"] }
minisign = "0.10.0"
proptest = "1.12.0"
serde_norway = "0.9.42"
tempfile = "3.27.0"
