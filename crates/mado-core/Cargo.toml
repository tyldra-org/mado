[package]
name = "mado-core"
description = "The core actor: browser state, command dispatch, patches and service wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Hooks only tests use: a handler that panics (and, from M1-T11, the rest).
test-hooks = []

[lints]
workspace = true

[dependencies]
mado-engine = { version = "0.0.0", path = "../mado-engine" }
mado-platform = { version = "0.0.0", path = "../mado-platform" }
mado-settings = { version = "0.0.0", path = "../mado-settings" }
mado-storage = { version = "0.0.0", path = "../mado-storage" }
mado-types = { version = "0.0.0", path = "../mado-types" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
json-patch = "5.0.0"
mado-engine-fake = { version = "0.0.0", path = "../mado-engine-fake" }
rusqlite = "0.42.0"
tempfile = "3.27.0"
