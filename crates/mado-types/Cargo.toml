[package]
name = "mado-types"
description = "Shared IDs, state document, commands, events and errors, exported to TypeScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mado-types-derive = { version = "0.0.0", path = "../mado-types-derive" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1.29.2", features = ["v7", "serde"] }

[dev-dependencies]
json-patch = "5.0.0"
proptest = "1.12.0"
