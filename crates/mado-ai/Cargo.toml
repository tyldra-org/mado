[package]
name = "mado-ai"
description = "AI connections, model catalog, roles and provider clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# A mock HTTP server for other crates' tests.
testing = []

[lints]
workspace = true

[dependencies]
data-encoding = "2.11.1"
getrandom = "0.4.3"
mado-lists = { version = "0.0.0", path = "../mado-lists" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
