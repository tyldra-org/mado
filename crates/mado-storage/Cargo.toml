[package]
name = "mado-storage"
description = "SQLite connections, migrations, backups, recovery and the change log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
