[package]
name = "mado-autofill"
description = "Form model, fill sources, saving, TOTP and passkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mado-vault = { version = "0.0.0", path = "../mado-vault" }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
psl = "2.1.254"
rqrr = "0.11.0"
rusqlite = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.1"
zxcvbn = "3.1.1"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
mado-storage = { version = "0.0.0", path = "../mado-storage" }
mado-vault = { version = "0.0.0", path = "../mado-vault", features = ["testing"] }
tempfile = "3.27.0"
