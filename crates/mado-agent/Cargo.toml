[package]
name = "mado-agent"
description = "Agent runtime, tools, approvals, audit, memory, skills and routines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mado-ai = { version = "0.0.0", path = "../mado-ai" }
mado-lists = { version = "0.0.0", path = "../mado-lists" }
mado-types = { version = "0.0.0", path = "../mado-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "macros"] }
