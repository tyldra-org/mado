[package]
name = "mado-cli"
description = "The mado command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mado"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
data-encoding = "2.11.1"
mado-control = { version = "0.0.0", path = "../mado-control" }
mado-platform = { version = "0.0.0", path = "../mado-platform" }
mado-types = { version = "0.0.0", path = "../mado-types" }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "time", "macros", "signal", "sync", "io-std"] }
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"
