[package]
name = "mado-vault"
description = "Mado Passwords storage and cryptography."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# A software stand-in for the Secure Enclave, for tests of crates that use
# the vault.
testing = []

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mado-platform = { version = "0.0.0", path = "../mado-platform" }
mado-types = { version = "0.0.0", path = "../mado-types" }
p256 = { version = "0.14.0", features = ["ecdh"] }
psl = "2.1.254"
rusqlite = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
mado-storage = { version = "0.0.0", path = "../mado-storage" }
tempfile = "3.27.0"
