[package]
name = "mado-engine-webkit"
description = "macOS engine adapter on WKWebView."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
unwrap_used = "deny"

[dependencies]
block2 = "0.6.2"
mado-engine = { version = "0.0.0", path = "../mado-engine" }
mado-types = { version = "0.0.0", path = "../mado-types" }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
serde_json = "1.0.154"
tracing = "0.1.44"
