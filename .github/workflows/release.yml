# Ships Mado (spec 15 §7, §9). A tag v1.2.3 goes to stable and v1.2.3-beta.N
# to beta; the daily schedule and manual runs build main to nightly
# (scripts/release/plan.ts decides). Every run tests end to end, builds and
# signs for Apple silicon, then publishes (scripts/release/publish.ts).
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Tags and nightlies queue separately; neither cancels a publish.
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - id: plan
        run: bun scripts/release/plan.ts

  test:
    name: End to end
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build the app with test hooks
        run: cargo build -p mado-app --features test-hooks --locked
      - name: End-to-end tests
        env:
          MADO_E2E_BIN: target/debug/mado-app
        run: bun test tests/e2e

  build:
    name: Build and sign
    needs: [version, test]
    # Apple silicon runners; Mado ships for Apple silicon only.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Credits (fails on a licence not in about.toml)
        run: bun scripts/credits.ts
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build, sign and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release/macos.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mado
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and overwrites the channel file.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mado
          path: dist
      - name: Create the release and point the channel at it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: bun scripts/release/publish.ts dist "$VERSION" "$CHANNEL" "$PRERELEASE"
