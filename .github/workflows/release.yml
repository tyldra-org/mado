# Ships Mado (spec 15 §7, §9). A tag v1.2.3 goes to stable and v1.2.3-beta.N
# to beta; a manual run builds main to nightly (scripts/release/plan.ts
# decides). There is no scheduled nightly for now: add
# `schedule: [{cron: "30 3 * * *"}]` to bring it back. Every run tests end to
# end, builds and signs for Apple silicon, then publishes
# (scripts/release/publish.ts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Tags and nightlies queue separately; neither cancels a publish.
  group: release-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      # The Mac the end-to-end and build jobs run on: the owner's own (a
      # self-hosted runner labelled mado-mac) when the repository variable
      # USE_MY_MAC is "true" and the owner pushed the tag or started the run;
      # GitHub's otherwise. Only people with write access can start a release.
      mac: ${{ (vars.USE_MY_MAC == 'true' && github.actor == 'yogeshprasad098') && 'macos-self-hosted' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - id: plan
        run: bun scripts/release/plan.ts

  test:
    name: End to end (${{ matrix.mac }})
    needs: version
    # A one-entry matrix, so the job's name says which Mac ran it.
    strategy:
      matrix:
        mac: ["${{ needs.version.outputs.mac }}"]
    runs-on: ${{ matrix.mac == 'macos-self-hosted' && fromJSON('["self-hosted","mado-mac"]') || 'macos-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The owner's Mac keeps this job's test build between releases, outside
      # the checkout and apart from CI's, so it stays warm. Only the owner's
      # own runs use that Mac.
      - name: Keep the build on this Mac
        if: runner.environment == 'self-hosted'
        run: |
          dir="$HOME/.cache/mado-ci/release-e2e"
          # Cargo never deletes old build copies, so the kept folder only
          # grows: past 30 GB, start it over.
          if [ -d "$dir" ] && [ "$(du -sk "$dir" | cut -f1)" -gt $((30 * 1024 * 1024)) ]; then
            echo "The kept build passed 30 GB; starting it over."
            rm -rf "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build the app with test hooks, the mado CLI and the fixture server
        # The CLI, MCP and task tests run the real `mado` (target/debug/mado).
        run: cargo build -p mado-app --features test-hooks --locked && cargo build -p mado-cli -p mado-fixture-server --locked
      # The end-to-end suite behind the recording proxy: it fails on a failing
      # test or on any host outside tests/network-allowlist.json (spec 08 §11).
      - name: End-to-end tests and network audit
        env:
          MADO_TEST_HEADLESS: "1"
        run: |
          bin="${CARGO_TARGET_DIR:-target}/debug"
          MADO_E2E_BIN="$bin/mado-app" MADO_FIXTURE_BIN="$bin/mado-fixture-server" MADO_CLI_BIN="$bin/mado" \
            bun scripts/network-audit.ts

  build:
    name: Build and sign (${{ matrix.mac }})
    needs: [version, test]
    # Apple silicon only, as Mado ships. On the owner's Mac too this builds
    # from nothing: the checkout's target/ is cleaned each run, so a release
    # never reuses an earlier build. macos.sh signs from a throwaway keychain
    # and puts the keychain search list back when it ends.
    strategy:
      matrix:
        mac: ["${{ needs.version.outputs.mac }}"]
    runs-on: ${{ matrix.mac == 'macos-self-hosted' && fromJSON('["self-hosted","mado-mac"]') || 'macos-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Credits (fails on a licence not in about.toml)
        run: bun scripts/credits.ts
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build, sign and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release/macos.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mado
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and overwrites the channel file.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mado
          path: dist
      - name: Create the release and point the channel at it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: bun scripts/release/publish.ts dist "$VERSION" "$CHANNEL" "$PRERELEASE"
