# Dependabot pull requests land on main by themselves once the ruleset's
# required checks pass: "ci", plus "linked-issue" and "protected-files" from
# pull-requests.yml, which pass for Dependabot without an issue and with
# workflow pin updates. Patch and minor updates and all GitHub Actions updates
# get auto-merge; a major package update stays open for a maintainer. A
# failing check leaves any of them open.
#
# It runs on Dependabot's own branch pushes, not on pull requests, so no
# other pull request ever starts it or lists it among its checks. Only a push
# by Dependabot itself counts; forks cannot push here.
# Needs "Allow auto-merge" on in the repository settings.
name: dependabot-auto-merge

on:
  push:
    branches: ["dependabot/**"]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    # The push itself must come from Dependabot; the step then arms only an
    # open pull request that Dependabot opened from this branch.
    if: github.event.pusher.name == 'dependabot[bot]' && github.repository == 'tyldra-org/mado'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Dependabot's commit message lists each update with its
          # update-type; a major package update waits for a maintainer.
          case "$BRANCH" in
            dependabot/github_actions/*) ;;
            *)
              if printf '%s\n' "$COMMIT_MESSAGE" | grep -q 'update-type: version-update:semver-major'; then
                echo "A major update: left for a maintainer."
                exit 0
              fi
              ;;
          esac
          # Dependabot opens the pull request just after it pushes.
          for _ in $(seq 1 24); do
            url=$(gh pr list --head "$BRANCH" --base main --author "app/dependabot" --state open --json url --jq '.[0].url // ""')
            if [ -n "$url" ]; then
              gh pr merge --auto --squash "$url"
              exit 0
            fi
            sleep 5
          done
          echo "No open Dependabot pull request for $BRANCH."
