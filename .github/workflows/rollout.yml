# Raises or halts a channel's staged rollout (spec 15 §5, §7): 0 stops
# offering the update, 0.5 and 1 widen it.
name: Rollout

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, beta, nightly]
        required: true
      rollout:
        description: 0 to 1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          case "$ROLLOUT" in
            0|1|0.[0-9]*) ;;
            *) echo "rollout must be 0 to 1" >&2; exit 1 ;;
          esac
          gh release download channels --repo "$GITHUB_REPOSITORY" --pattern "$CHANNEL.json"
          jq --argjson r "$ROLLOUT" '.rollout = $r' "$CHANNEL.json" > next.json
          mv next.json "$CHANNEL.json"
          gh release upload channels "$CHANNEL.json" --repo "$GITHUB_REPOSITORY" --clobber
