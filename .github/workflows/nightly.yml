# A nightly build of main to the nightly channel (spec 15 §7, §9): the
# end-to-end tests, then a signed build for each architecture, then a GitHub
# release and the channel file the updater reads.
# Versions are <next>-nightly.<yyyymmdd>.<run>, so a manual run on the same
# day still sorts after the scheduled one.
name: Nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          next=$(jq -r .version app/tauri.conf.json)
          echo "version=$next-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  test:
    name: End to end
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build the app with test hooks
        run: cargo build -p mado-app --features test-hooks --locked
      - name: End-to-end tests
        env:
          MADO_E2E_BIN: target/debug/mado-app
        run: bun test tests/e2e

  build:
    name: Build (${{ matrix.arch }})
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Credits (fails on a licence not in about.toml)
        run: bun scripts/credits.ts
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build, sign and package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release/macos.sh "$ARCH" "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mado-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and overwrites the channel file.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # A release must not restore a cache an untrusted run could write.
          no-cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mado-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: true
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          rm dist/SHA256SUMS-*
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mado $VERSION" --notes "Mado $VERSION. Unsigned by Apple: see Privacy & Security, Open Anyway." "${flags[@]}"
      - name: Point the channel at it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: nightly
          ROLLOUT: "1"
        run: |
          cd dist
          bun ../scripts/release/channel.ts "$VERSION" "$ROLLOUT" false "$CHANNEL.json"
          gh release view channels --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create channels --repo "$GITHUB_REPOSITORY" --prerelease --title "Update channels" \
              --notes "The files Mado's updater reads (spec 15 §5). Not a release."
          gh release upload channels "$CHANNEL.json" --repo "$GITHUB_REPOSITORY" --clobber
