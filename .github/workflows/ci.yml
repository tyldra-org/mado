# Continuous integration. Every job calls scripts/check.sh, the same entry
# point developers run locally. Branch protection requires only the aggregate
# job "ci", so jobs can be added or renamed without editing the ruleset.
#
# The "changes" job runs first and picks the jobs a change needs, so a
# docs-only change finishes in seconds. A changed path that no list in
# scripts/ci-scope.ts names runs everything. Pull requests also narrow Rust to the
# changed crates and their dependents, and bun tests to the files the change
# reaches. On main, each job that runs checks the whole workspace and every
# test; the weekly and manual runs check everything.
# There are deliberately no paths filters on the triggers: a skipped workflow
# never reports "ci", and the merge would wait forever.
name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Weekly full run: new advisories for cargo deny, and runner image drift.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only by default; no job needs more. No secrets are used, so fork pull
# requests run with the same workflow safely.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded pull request runs only; every default-branch run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Decides which jobs this change needs (scripts/ci-scope.ts). Docs-only
    # changes skip everything else; the "ci" job still reports.
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        # pipefail: a failing scope script must fail the job, never leave the
        # outputs empty and skip every check.
        shell: bash
    outputs:
      # The Mac the macOS jobs run on: the owner's own (a self-hosted runner
      # labelled mado-mac) when the repository variable USE_MY_MAC is "true"
      # and the owner both started this run and, for a pull request, opened
      # it from a branch of this repository; GitHub's otherwise. Anyone
      # else's push, a fork, Dependabot or a bot runs on GitHub's Macs. Fork
      # pull requests also wait for the owner's approval before any job runs.
      mac: ${{ (vars.USE_MY_MAC == 'true' && github.actor == 'yogeshprasad098' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == 'yogeshprasad098' && github.event.pull_request.head.repo.full_name == github.repository))) && '["self-hosted","mado-mac"]' || '"macos-latest"' }}
      base: ${{ steps.base.outputs.sha }}
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      ts: ${{ steps.scope.outputs.ts }}
      ts-global: ${{ steps.scope.outputs.tsGlobal }}
      supply: ${{ steps.scope.outputs.supply }}
      shell: ${{ steps.scope.outputs.shell }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base branch, so the diff is exactly what the PR changes.
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Find the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            # A new branch or a force push has no usable "before": check everything.
            push)
              if git fetch --no-tags --depth=1 origin "$BEFORE"; then base=$BEFORE; fi
              ;;
          esac
          # The test jobs paste the base into commands: a full commit ID or nothing.
          if [[ ! $base =~ ^[0-9a-f]{40}$ ]]; then base=""; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Decide what to check
        id: scope
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: bun scripts/ci-scope.ts areas "$BASE" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Mado ships on macOS: lint and test on a Mac.
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Line tables keep file:line in backtraces with far less debug info to
      # compile, link and cache. rust-cache already turns incremental off.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # .config/nextest.toml: report every failure, never retry.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Bun runs the dependency rule check and the crate scope script; neither
      # needs bun install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The owner's Mac keeps one build folder between runs, outside the
      # checkout (which is cleaned each run), so builds stay warm and
      # incremental; GitHub's Macs restore the shared cache instead.
      - name: Keep the build on this Mac
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/mado-ci/target" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          # Only main writes the cache; pull requests restore it. Keeps PR
          # caches from evicting the one every PR starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest
      - name: Choose crates
        # Pull requests check the changed crates and everything depending on
        # them; main, schedules and manual runs check the whole workspace.
        env:
          BASE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full != 'true' && needs.changes.outputs.base || '' }}
        run: bun scripts/ci-scope.ts cargo "$BASE" | tee -a "$GITHUB_ENV"
      - name: Check
        # No separate build stage: clippy type-checks every target and the
        # tests compile and link them, so `cargo build` only repeated work
        # (about a minute). The release workflow builds the app itself.
        # Doc tests compile every crate once more (about 45 s) and there are
        # none yet, so pull requests skip them; main still runs them.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then export CHECK_CARGO_DOC_PACKAGES=""; fi
          ./scripts/check.sh --all --scope rust format lint test

  ts:
    name: TypeScript (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Format, lint, typecheck, build and test do not depend on the OS:
          # run them once, on the fastest runner.
          - os: ubuntu-latest
            stages: format lint build test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Only main saves the cache; pull requests restore main's, so their
      # entries never evict it.
      - name: Restore Bun downloads
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun downloads
        if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Check
        env:
          # Pull requests that change only source files run the tests those
          # files reach; dependency or config changes run every test.
          CHECK_TS_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full != 'true' && needs.changes.outputs.ts-global != 'true' && needs.changes.outputs.base || '' }}
        run: ./scripts/check.sh --all --scope ts ${{ matrix.stages }}

  visual:
    # Screenshot tests of every gallery screen in light and dark (M6-T10),
    # in WebKit on a Mac, where the stored images were made.
    name: Screenshots
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.mac) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install WebKit
        run: bunx playwright install webkit
      - name: Compare screenshots
        run: bun run visual
      - name: Keep the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: test-results/
          retention-days: 7

  supply:
    name: Supply chain
    needs: changes
    if: needs.changes.outputs.supply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny
      - name: Check
        run: ./scripts/check.sh --all supply

  scripts:
    name: Shell scripts and workflows
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dependabot cannot bump these two; update them by hand.
      ACTIONLINT_VERSION: v1.7.12
      ZIZMOR_VERSION: "1.32.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only main saves actionlint; pull requests restore it.
      - name: Restore actionlint
        id: actionlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}
      - name: Install actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        # go install verifies the module against the Go checksum database.
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      - name: Save actionlint
        if: github.ref == 'refs/heads/main' && steps.actionlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}
      # zizmor from PyPI through pipx, which GitHub's Linux images include.
      - name: Install zizmor
        run: pipx install "zizmor==$ZIZMOR_VERSION"
      - name: Check
        run: PATH="$(go env GOPATH)/bin:$HOME/.local/bin:$PATH" ./scripts/check.sh --all shell workflows

  required:
    # The single required status check. It succeeds only if every needed job
    # succeeded or was skipped because the change did not need it.
    name: ci
    if: always()
    needs: [changes, rust, ts, visual, supply, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A required job finished with: $result"; exit 1 ;;
            esac
          done
          echo "All required jobs passed: $RESULTS"
