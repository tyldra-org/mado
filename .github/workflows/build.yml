# The app itself, on a Mac (mado-docs/spec/15-release-and-build.md section 7):
# the end-to-end suite of spec 16 drives the real app over its control
# endpoint. Runs on every push to main, on pull requests labelled "build",
# and by hand.
name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: End to end (macOS)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the UI and page scripts
        run: bun run build
      - name: Build the app with test hooks
        run: cargo build -p mado-app --features test-hooks --locked
      - name: End-to-end tests
        env:
          MADO_E2E_BIN: target/debug/mado-app
        run: bun test tests/e2e
