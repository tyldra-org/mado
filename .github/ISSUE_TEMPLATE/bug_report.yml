name: Bug report
description: Report something in Mado that does not work as it should.
title: "bug: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security vulnerabilities must be reported
        privately; see SECURITY.md. A site that looks broken? Check whether it
        also breaks in Safari (macOS) or Edge (Windows), and say so below.
  - type: dropdown
    id: area
    attributes:
      label: Part of Mado
      options:
        - Tabs, windows and browsing
        - Ad and tracker blocking
        - Extensions
        - Passwords and autofill
        - AI, agents and the CLI
        - Settings and the interface
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. Include the site address if a page is involved.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mado version
      description: From Mado > About, or the commit SHA if you built it yourself.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: macOS 26.1 or Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: other-browser
    attributes:
      label: Does it also happen in Safari (macOS) or Edge (Windows)?
      options:
        - "No, only in Mado"
        - "Yes, there too"
        - "Not tried"
        - "Not about a website"
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Extensions
      description: Extensions turned on when it happened, if any.
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste relevant output. Remove passwords, tokens and personal data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
