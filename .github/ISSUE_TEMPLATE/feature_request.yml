name: Feature request
description: Something Mado should do, or do differently.
title: "feat: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Mado is pre-alpha and built milestone by milestone. Check the roadmap in
        the README first: the feature may already be planned. Describe the
        problem before the solution.
  - type: dropdown
    id: area
    attributes:
      label: Part of Mado
      options:
        - Tabs, windows and browsing
        - Ad and tracker blocking
        - Extensions
        - Passwords and autofill
        - AI, agents and the CLI
        - Settings and the interface
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like Mado to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches, and why they fall short.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
